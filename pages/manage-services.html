<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Manage Services</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/owner-dashboard.css" />
</head>

<body class="owner-page">
  <header class="topbar">
    <div class="container owner-shell-header">
      <div class="brand owner-brand">
        <img src="../assets/images/slotzy-logo.png" alt="Slotzy logo" class="logo" />
        <div class="owner-brand-copy">
          <h2>Manage Services</h2>
          <p>Business Control Center</p>
        </div>
      </div>
      <nav class="owner-header-actions">
        <a href="business-owner.html" class="link">Back to Dashboard</a>
        <span id="userBadge" class="user-badge hidden"></span>
      </nav>
    </div>
  </header>

  <main class="container owner-dashboard owner-layout">
    <section class="card dashboard-header">
      <h1>Service Editor</h1>
      <p>Add or remove services for your business.</p>
    </section>

    <div class="owner-two-col">
      <section class="card owner-panel">
        <h2>Add Service</h2>
        <label for="serviceName">Service Name</label>
        <input id="serviceName" type="text" placeholder="Service name" />

        <label for="servicePrice">Price</label>
        <input id="servicePrice" type="number" placeholder="Price" />

        <label for="serviceDuration">Duration</label>
        <input id="serviceDuration" type="number" placeholder="Minutes" />

        <button id="addServiceBtn" class="btn btn-primary" type="button">Add Service</button>
      </section>

      <section class="card owner-panel">
        <h2>Service List</h2>
        <div id="serviceList" class="grid"></div>
      </section>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Slotzy. All rights reserved.</p>
  </footer>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script type="module" src="../js/session-ui.js"></script>
  <script type="module" src="../js/manage-services.js"></script>
</body>
</html>
