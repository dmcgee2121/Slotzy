<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Clients</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/owner-dashboard.css" />
</head>

<body class="owner-page">
  <header class="topbar">
    <div class="container owner-shell-header">
      <div class="brand owner-brand">
        <img src="../assets/images/slotzy-logo.png" alt="Slotzy logo" class="logo" />
        <div class="owner-brand-copy">
          <h2>Clients</h2>
          <p>Business Control Center</p>
        </div>
      </div>
      <nav class="owner-header-actions" aria-label="Owner navigation">
        <a href="business-owner.html" class="link">Dashboard</a>
        <a href="manage-appointments.html" class="link">Appointments</a>
        <a href="manage-services.html" class="link">Services</a>
        <a href="manage-barbers.html" class="link">Team</a>
        <a href="settings.html" class="link">Settings</a>
        <span id="userBadge" class="user-badge hidden"></span>
        <button id="logoutBtn" class="link logout-btn">Logout</button>
      </nav>
    </div>
  </header>

  <main class="container owner-dashboard owner-layout">
    <section class="card dashboard-header">
      <h1>Client List</h1>
      <p>Repeat clients and visit history derived from bookings.</p>
      <p id="clientsSummary" class="small muted">0 clients found.</p>
    </section>

    <div class="owner-two-col clients-layout">
      <section class="card owner-panel">
        <div class="owner-panel-heading">
          <h2>All Clients</h2>
          <button id="exportClientsCsvBtn" class="btn btn-ghost" type="button">Export Clients CSV</button>
        </div>
        <label for="client-search">Search by name or contact</label>
        <input type="text" id="client-search" placeholder="e.g. Jasmine or (555)..." />

        <label for="repeat-only-toggle" class="small">
          <input type="checkbox" id="repeat-only-toggle" />
          Repeat clients only (2+ visits)
        </label>

        <button id="clear-filters" class="btn btn-ghost" type="button">Clear Filters</button>
        <p id="client-history-status" class="small booking-status" role="status" aria-live="polite" aria-atomic="true"></p>

        <section id="client-list" class="clients-list"></section>
      </section>

      <section class="card owner-panel">
        <h2 id="selected-client-heading">Select a client</h2>
        <p id="selected-client-summary" class="small muted">Choose a client to see appointment history.</p>
        <section id="client-history-list" class="clients-history-list"></section>
      </section>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Slotzy. All rights reserved.</p>
  </footer>

  <script type="module" src="../js/owner-setup-guard.js"></script>
  <script type="module" src="../js/session-ui.js"></script>
  <script type="module" src="../js/client-history-overview.js"></script>
</body>
</html>
