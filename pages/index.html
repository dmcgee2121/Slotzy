<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Slotzy</title>
  <meta name="theme-color" content="#1d4ed8" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Slotzy" />
  <link rel="manifest" href="../manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="../assets/icons/icon-192.png" />

  <!-- Link to external CSS file for all styling -->
  <link rel="stylesheet" href="../css/styles.css" />
</head>

<body>
  <a class="skip-link" href="#app">Skip to main content</a>
  <!-- ---------- TOP NAVIGATION BAR ---------- -->
  <header class="topbar">
    <div class="container">
      <!-- Brand/logo section -->
      <div class="brand">
        <!-- Slotzy logo image -->
        <!-- width/height here are a safe fallback in case CSS doesn't load -->
        <img src="../assets/images/slotzy-logo.png" alt="Slotzy logo" class="logo" height="60">
      </div>

      <!-- Navigation buttons -->
      <nav id="nav" aria-label="Primary">
        <!-- Home button: shows homepage -->
        <button id="btn-home" class="link" aria-label="Home">Home</button>
        <a href="pricing.html" class="link">Pricing</a>

        <!-- Login/Register button: opens login modal -->
        <button id="btn-login" class="link">Owner / Barber Login</button>

        <!-- Dashboard button: shown only if user is signed in -->
        <button id="btn-dashboard" class="link hidden">Dashboard</button>

        <!-- Logout button: shown only if user is signed in -->
        <button id="logoutBtn" class="link hidden logout-btn">Logout</button>
        <span id="userBadge" class="user-badge hidden"></span>
      </nav>
    </div>
  </header>

  <!-- ---------- MAIN APP CONTAINER ---------- -->
  <!-- This is where JavaScript will render different pages dynamically -->
  <main class="container" id="app" tabindex="-1">
    <!-- Example: Home page content, dashboards, services will appear here -->
  </main>

  <!-- ---------- MODAL OVERLAY ---------- -->
  <!-- Hidden by default. Used for login forms, booking forms, or any popup -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="modal-title" aria-describedby="auth-error">
    <div class="modal-panel" id="modal-panel" tabindex="-1">
      <!-- Modal content is injected by JavaScript -->
       
    </div>
  </div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <!-- ---------- PAGE FOOTER ---------- -->
  <footer>
    <p>© 2026 Slotzy. All rights reserved.</p>
  </footer>

  <!-- ---------- JAVASCRIPT ---------- -->
  <!-- Link to main JS file where all functionality is handled -->
  <script>
    (function () {
      if (window.location.protocol !== "file:") return;

      var app = document.getElementById("app");
      var banner = document.createElement("div");

      banner.setAttribute("role", "alert");
      banner.className = "empty-state empty-state-warning";
      banner.innerHTML = "<span class=\"empty-state-icon\" aria-hidden=\"true\">!</span><h2 class=\"empty-state-title\">Slotzy uses JavaScript modules and must be served over HTTP.</h2><p class=\"empty-state-subtitle\">1. Open this project in VS Code.</p><p class=\"empty-state-subtitle\">2. Click <strong>Go Live</strong> and open the local URL instead of the <code>file://</code> page.</p>";

      if (app) {
        app.innerHTML = "";
        app.appendChild(banner);
        return;
      }

      document.body.insertBefore(banner, document.body.firstChild);
    })();
  </script>
  <script type="module" src="../js/session-ui.js"></script>
  <script type="module" src="../js/main.js"></script>
</body>
</html>
